'use strict';
const app=document.getElementById('app'),dialog=document.getElementById('hint-dialog');
let screen='select',itemId='',page='',major='',hintLevel=0,revealedStep=0,op=-1,photo='',sample=false,corrected=false,timer=null,origin=null,consultation='check',depth=0,demoCase='order';
const current=()=>items[itemId];
const labels={select:'問題と相談を選ぶ',hint:'解き方のヒント',capture:'ノートを見せる',camera:'ノートを撮る',review:'途中式を確認する',explain:'解説がわからない',practice:'ノートで続きを解く'};
const preview=['select','hint','capture','camera','review','explain','practice'];
function button(label,action,cls='primary',disabled=false){return `<button type="button" class="${cls}" data-action="${action}" ${disabled?'disabled':''}>${label}</button>`}
function problem(){const q=current();return `<div class="problem"><small>数学 · p.${q.page} ${q.part}　大問${q.major}（${q.minor}）<span class="kind">${q.kind}</span></small><p class="instruction">${q.instruction}</p><div class="math">${q.formula}</div></div>`}
function steps(n){return `<div class="steps"><span class="${n===1?'active':''}"><i>1</i>問題を選ぶ</span><b></b><span class="${n===2?'active':''}"><i>2</i>相談する</span><b></b><span class="${n===3?'active':''}"><i>3</i>学習を続ける</span></div>`}
function ensure(){if(!itemId){itemId='calcOrder';page='4';major='3'}}
function go(next){if(timer){clearTimeout(timer);timer=null}if(dialog.open)dialog.close();if(next!=='select')ensure();screen=next;render();const h=app.querySelector('h1');if(h){h.tabIndex=-1;h.focus({preventScroll:true})}window.scrollTo({top:0,behavior:'instant'})}
function back(){return button('← 問題と相談を選ぶ画面へ','select','back')}
function actions(){return `<div class="help-list">${[['hint','?','解き方のヒント','一手ずつ、考える手がかりを見る'],['capture','✓','解答を見て','ノートの途中式や答えを見てもらう'],['explain','…','解説がわからない','わからない操作を選んで詳しく聞く']].map(([a,i,t,s])=>`<button type="button" class="help" data-action="${a}"><span class="symbol" aria-hidden="true">${i}</span><span><strong>${t}</strong><small>${s}</small></span><span class="arrow">›</span></button>`).join('')}</div>`}
const lesson=()=>learning[itemId];
const diagnosis=()=>photoCases[itemId][demoCase];
function stepMap(){revealedStep=Math.max(revealedStep,hintLevel);return `<nav class="step-map" aria-label="解くステップ">${lesson().slice(0,revealedStep+1).map((x,i)=>`<button type="button" class="step-chip ${i===hintLevel?'current':''}" data-step="${i}" ${i===hintLevel?'aria-current="step"':''}>${i+1}. ${x[0]}</button>`).join('')}</nav>`}
function showDepth(){const st=lesson()[hintLevel];modal(`ステップ${hintLevel+1}：${st[0]}`,`<span class="hint-count">詳しいヒント ${depth+1} / ${st[2].length}</span>${st[2][depth]}<div class="understanding"><p>正しいと思うものを選んでみて</p>${st[3].map((x,i)=>`<button type="button" class="secondary" data-choice="${i}">${x}</button>`).join('')}<p id="choice-feedback" role="status"></p></div>`,`${button('さらに詳しく','deeper','secondary',depth>=st[2].length-1)}${button('元の画面に戻る','close','mutedbutton')}`)}
function render(){const q=current();let html='';
if(screen==='select'){html=steps(1)+`<p class="eyebrow">紙のテキストと、一緒に。</p><h1>どの問題で困っている？</h1><p class="sub">手元の教材を見て、ページ・大問・小問を選んでね。</p><div class="fields"><label for="page">ページ<select id="page"><option value="">選ぶ</option>${['4','148','150'].map(n=>`<option value="${n}" ${page===n?'selected':''}>p.${n}</option>`).join('')}</select></label><label for="major">大問<select id="major" ${!page?'disabled':''}><option value="">選ぶ</option>${[...new Set(Object.values(items).filter(x=>x.page===page).map(x=>x.major))].map(n=>`<option value="${n}" ${major===n?'selected':''}>${n}</option>`).join('')}</select></label><label for="item">小問<select id="item" ${!major?'disabled':''}><option value="">選ぶ</option>${Object.entries(items).filter(([k,x])=>x.page===page&&x.major===major).map(([k,x])=>`<option value="${k}" ${itemId===k?'selected':''}>（${x.minor}）</option>`).join('')}</select></label></div>`+(q?problem()+`<h2 class="help-title">どんな手助けがほしい？</h2>`+actions():`<p class="footnote empty-note">問題を選ぶと、問題文と相談ボタンが表示されます。<br>ノートが途中まででも、大丈夫。</p>`)}
if(screen==='hint')html=steps(2)+back()+`<h1>解き方のヒント</h1>`+problem()+stepMap()+`<div class="teacher">AIチュータ</div><div class="bubble"><span class="hint-count">ステップ ${hintLevel+1} / ${lesson().length} · ${lesson()[hintLevel][0]}</span><p class="prompt">${lesson()[hintLevel][1]}</p></div><div class="hint-controls">${button('分かった・ノートでやってみる','done')}${button('このヒントを詳しく','detail','secondary')}${button('次のステップへ','nextStep','mutedbutton',hintLevel===lesson().length-1)}${button('途中までのノートを見て','notebook','mutedbutton')}</div>`;
if(screen==='capture')html=steps(2)+back()+`<h1>${consultation==='stuck'?'また分からない':'解答を見て'}</h1><p class="sub">${consultation==='stuck'?'今のノートを見せてね。どこまで進めたか、一緒に確認しよう。':'途中まででも大丈夫。見てほしい式を写してね。'}</p>`+problem()+`<div class="photo-actions">${button('ノートを撮る','camera','secondary')}<label class="mutedbutton upload">写真を選ぶ<input type="file" id="photo" accept="image/*" aria-label="写真を選ぶ"></label></div>${photo?`<figure class="photo-frame"><img id="photo-preview" alt="選んだノート写真"><figcaption>選んだノート写真</figcaption></figure><p class="sub">写真を選択できました。</p>`:''}<p class="footnote">撮影の流れを体験できます。</p>`;
if(screen==='camera')html=steps(2)+button('← 写真の選び方に戻る','capture','back')+`<h1>ノートを撮る</h1><p class="sub">${consultation==='stuck'?'今解いているところまで、枠の中に入るように写してね。':'見てほしい式が、枠の中に入るように写してね。'}</p>`+problem()+`<div class="camera-shell"><div class="camera-top"><span>写真</span><span>撮影プレビュー</span></div><div class="camera-view" id="camera-view"><div class="camera-paper"><div class="camera-paper-title">p.${q.page}　大問${q.major}（${q.minor}）</div>${diagnosis().lines.map(line=>`<div class="camera-line math">${line}</div>`).join('')}</div><div class="camera-guides" aria-hidden="true"></div></div><div class="camera-bottom"><p id="camera-status" role="status">ノート全体が見えたら、撮影しよう</p><button type="button" class="shutter" data-action="shoot" aria-label="撮影する"><span aria-hidden="true"></span></button><span class="shutter-caption">撮影する</span></div></div><p class="footnote">撮影の体験用画面です。撮影後はサンプル答案で確認できます。</p>`;
if(screen==='review'){const d=diagnosis();const lines=corrected?q.correct:d.lines;html=steps(2)+back()+`<h1>${corrected?'答案を確認できたよ':'ノートから一緒に考えよう'}</h1>`+problem()+`<div class="sample-label">撮影後の答案例（モック）</div><div class="notepaper">${lines.map((line,i)=>`<div class="note-line ${!corrected&&i===d.mark?'marked':''}"><span class="line-number">${i+1}</span><span class="math">${line}</span>${!corrected&&i===d.mark?'<span class="check-label">一緒に確かめる行</span>':''}</div>`).join('')}</div><div class="teacher">AIチュータ</div><div class="bubble" role="status">${corrected?'よく出来たね。この答案例では、途中式と答えが合っているよ。':`<p>${d.ok}</p><p>${d.message}</p>`}</div>${!corrected?`<p class="sub">一緒に考える操作：ステップ${d.step+1}「${lesson()[d.step][0]}」</p><div class="review-actions">${button('このステップのヒントを見る','resumeStep')}${button('このステップを詳しく','diagnosisDetail','secondary')}${button('読み取りが違う・撮り直す','camera','mutedbutton')}</div><div class="sample-entry"><span>モック確認用</span>${button('修正後の答案例を確認','corrected','linkbutton')}</div>`:`<div class="review-actions">${button('この問題を終える','end')}${button('ステップを振り返る','hint','secondary')}</div>`}`}

if(screen==='practice')html=steps(3)+`<h1>ノートで続きを解いてみよう</h1>`+problem()+stepMap()+`<div class="bubble"><span class="hint-count">いま考えている操作：${lesson()[hintLevel][0]}</span><p>分かったことを、ノートで試してみよう。次に進めたら次のステップへ。ここで迷ったら、同じステップをもう少し詳しく考えよう。</p></div><div class="hint-controls">${hintLevel<lesson().length-1?button('ここまでできた・次のステップへ','nextStep'):button('最後まで解けた・解答を見て','check')}${button('まだ分からない・このステップを詳しく','detail','secondary')}${button('途中までのノートを見て','notebook','mutedbutton')}${hintLevel<lesson().length-1?button('最後まで解けた・解答を見て','check','mutedbutton'):''}${button('この問題を終える','end','mutedbutton')}</div>`;
if(screen==='explain')html=steps(2)+back()+`<h1>解説がわからない</h1><p class="sub">わからない操作を選んでね。</p>`+problem()+`<div class="operation-list">${q.ops.map(([title],i)=>`<button class="operation" type="button" data-op="${i}"><span class="op-num">${'①②③④⑤'[i]}</span><span>${title}</span><span class="arrow">›</span></button>`).join('')}</div><p class="footnote">選んだ操作だけ、詳しく説明するよ。</p>`;
app.innerHTML=html;if(photo&&screen==='capture')document.getElementById('photo-preview').src=photo;
const index=preview.indexOf(screen);document.getElementById('screen-label').textContent=labels[screen];document.getElementById('screen-count').textContent=(index+1)+' / '+preview.length;document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=index===preview.length-1;
const plan=document.getElementById('analysis-preview');if(plan)plan.innerHTML=q?`<strong>問題取込時に準備する解法ステップ（モック）</strong><ol>${lesson().map(st=>`<li>${st[0]}</li>`).join('')}</ol><p>各ステップにヒント・深掘り説明・確認の選択肢を用意。写真相談は該当ステップに戻ります。実装時には別の正しい解法も扱い、標準の順番との差だけで誤りとは判定しません。</p>`:'問題を選ぶと、事前分析を想定した解法ステップを表示します。';
const source=document.getElementById('source-link');source.href='https://d-edubook.com/html/digital-text/1958/#'+(q?.source||1);source.textContent=q?`教材：BUILDER受験版 数学 WEB見本 p.${q.page}・大問${q.major}（${q.minor}） ↗`:'教材：BUILDER受験版 数学 WEB見本 ↗';
}
function modal(title,body,follow=''){if(!dialog.open)origin=document.activeElement;document.getElementById('dialog-content').innerHTML=`<div class="teacher">AIチュータ</div><h2 id="dialog-title">${title}</h2>`+problem()+`<div class="bubble"><p>${body}</p></div><div class="row">${button('分かった','done')}${follow||button('元の画面に戻る','close','secondary')}</div>`;if(!dialog.open)dialog.showModal()}
function finish(){if(screen==='explain'&&op>=0)hintLevel=(['calcOrder','power'].includes(itemId)?[1,2][op]:op);go('practice')}
function act(a){if(a==='check'||a==='notebook'){consultation=a==='notebook'?'stuck':'check';go('capture');return}if(a==='stuck'){act('detail');return}if(a==='nextStep'){hintLevel=Math.min(hintLevel+1,lesson().length-1);depth=0;go('hint');return}if(a==='resumeStep'||a==='diagnosisDetail'){hintLevel=diagnosis().step;depth=0;go('hint');if(a==='diagnosisDetail')showDepth();return}if(a==='deeper'){depth=Math.min(depth+1,lesson()[hintLevel][2].length-1);showDepth();return}if(a==='end'){go('select');return}if(a==='done'){finish();return}if(a==='more'){act('detail');return}if(a==='detail'){depth=0;showDepth();return}if(a==='reason'){modal('この行を見直す理由',current().reason);return}if(a==='shoot'){if(screen!=='camera'||timer)return;sample=true;corrected=false;document.getElementById('camera-view').classList.add('shot');document.getElementById('camera-status').textContent='撮影できたよ。答案を確認しています…';app.querySelectorAll('button').forEach(b=>b.disabled=true);timer=setTimeout(()=>{timer=null;go('review')},750);return}if(a==='corrected'){corrected=true;hintLevel=lesson().length-1;go('review');return}if(a==='close'){dialog.close();return}if(a==='reset'){if(photo)URL.revokeObjectURL(photo);photo='';consultation='check';page='';major='';itemId='';hintLevel=0;revealedStep=0;depth=0;sample=false;corrected=false;go('select');return}if(preview.includes(a)){if(a==='capture'&&screen==='select')consultation='check';go(a)}}
document.addEventListener('click',e=>{const stepButton=e.target.closest('[data-step]');if(stepButton){const target=+stepButton.dataset.step;if(!Number.isInteger(target)||target<0||target>revealedStep)return;hintLevel=target;depth=0;go('hint');return}const choice=e.target.closest('[data-choice]');if(choice){document.getElementById('choice-feedback').textContent=+choice.dataset.choice===lesson()[hintLevel][4]?'その考え方で進めてみよう。ノートでこの操作を試してね。':'もう一度、上のヒントと選んだ操作を見比べてみよう。';return}const opButton=e.target.closest('[data-op]');if(opButton){op=+opButton.dataset.op;modal(current().ops[op][0],current().ops[op][1]);return}const b=e.target.closest('[data-action]');if(b&&!b.disabled)act(b.dataset.action)});
document.addEventListener('change',e=>{const id=e.target.id;if(id==='demo-case'){demoCase=e.target.value;corrected=false;if(screen==='camera'||screen==='review')render();return}if(id==='photo'){const f=e.target.files?.[0];if(!f)return;if(!f.type.startsWith('image/'))return;if(photo)URL.revokeObjectURL(photo);photo=URL.createObjectURL(f);render();return}if(id==='page'){page=e.target.value;major='';itemId=''}else if(id==='major'){major=e.target.value;itemId=''}else if(id==='item'){itemId=e.target.value}else return;hintLevel=0;revealedStep=0;depth=0;sample=false;corrected=false;consultation='check';if(photo)URL.revokeObjectURL(photo);photo='';render();document.getElementById(id==='page'&&page?'major':id==='major'&&major?'item':id).focus()});
dialog.querySelector('.close').onclick=()=>dialog.close();dialog.addEventListener('close',()=>{if(origin?.isConnected)origin.focus();origin=null});
document.getElementById('prev').onclick=()=>go(preview[Math.max(0,preview.indexOf(screen)-1)]);
document.getElementById('next').onclick=()=>{ensure();const next=preview[Math.min(preview.length-1,preview.indexOf(screen)+1)];if(next==='review'){sample=true;corrected=false}go(next)};
document.getElementById('reset').onclick=()=>act('reset');render();

</script></body></html>
